<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Heart Disease Expert System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Heart Disease Expert System</h1>
            <p>AI-powered medical decision support</p>
        </div>

        <div class="content">

            <div class="form-section">

                <h2>Patient Information</h2>

                <form id="diagnosisForm">

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" name="age" required>
                    </div>

                    <div class="form-group">
                        <label>Sex</label>
                        <select name="sex">
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Chest Pain Type</label>
                        <select name="cp">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Blood Pressure</label>
                        <input type="number" name="trestbps" required>
                    </div>

                    <div class="form-group">
                        <label>Cholesterol</label>
                        <input type="number" name="chol" required>
                    </div>

                    <div class="form-group">
                        <label>Fasting Blood Sugar</label>
                        <select name="fbs">
                            <option value="0">False</option>
                            <option value="1">True</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Resting ECG</label>
                        <select name="restecg">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Max Heart Rate</label>
                        <input type="number" name="thalach" required>
                    </div>

                    <div class="form-group">
                        <label>Exercise Angina</label>
                        <select name="exang">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Oldpeak</label>
                        <input type="number" step="0.1" name="oldpeak" required>
                    </div>

                    <div class="form-group">
                        <label>Slope</label>
                        <select name="slope">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>CA</label>
                        <select name="ca">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Thal</label>
                        <select name="thal">
                            <option value="3">3</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                        </select>
                    </div>

                    <button class="btn-submit" type="submit">
                        Analyze Patient
                    </button>

                </form>

            </div>

            <div class="results-section" id="resultsSection" style="display:none;">

                <h2>Diagnosis Result</h2>

                <div class="result-box" id="resultBox"></div>

                <div class="probability-section">

                    <h3>Probabilities</h3>

                    <div class="probability-item">
                        <label>Disease</label>

                        <div class="bar-container">
                            <div class="bar-fill" id="diseaseBar"></div>
                        </div>

                        <span id="diseaseProb"></span>
                    </div>

                    <div class="probability-item">
                        <label>No Disease</label>

                        <div class="bar-container">
                            <div class="bar-fill no-disease" id="noDiseaseBar"></div>
                        </div>

                        <span id="noDiseaseProb"></span>
                    </div>

                </div>

                <div class="rules-section">

                    <h3>Triggered Rules</h3>

                    <ul id="rulesList"></ul>

                </div>

                <div class="accuracy-section">

                    <h3>Model Accuracy</h3>

                    <p id="accuracy"></p>

                </div>

            </div>

            <div class="error-section" id="errorSection" style="display:none;">

                <h3>Error</h3>

                <p id="errorMessage"></p>

            </div>

        </div>

        <div class="footer">
            Heart Disease Expert System Project
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
